set -g history-limit 50000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g set-titles on
set-option -g set-titles-string '#T'
set -g renumber-windows on

set-option -g repeat-time 1000

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split config
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make mice great again
set -g mouse on

# Required for Iterm2 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Multi monitor
set -g focus-events on
setw -g aggressive-resize on

set -g status-keys vi
setw -g mode-keys vi

# Rotate through panes
bind -r Tab select-pane -t :.+

# Copy output of last command
# Modified version of https://ianthehenry.com/posts/tmux-copy-last-command/
bind t {
  copy-mode
  send -X clear-selection
  send -X start-of-line
  send -X start-of-line
  send -X cursor-up
  send -X start-of-line
  send -X start-of-line

  if -F "#{m:*└╼ *,#{copy_cursor_line}}" {
    send -X search-forward-text "└╼ "
    send -X stop-selection
    send -X -N 2 cursor-right
    send -X begin-selection
    send -X end-of-line
    send -X end-of-line
    if "#{m:*└╼ *,#{copy_cursor_line}}" {
      send -X cursor-left
    }
  } {
    send -X cursor-up
    send -X end-of-line
    send -X end-of-line
    send -X begin-selection
    send -X search-backward-text "└╼ "
    send -X end-of-line
    send -X end-of-line
    send -X cursor-right
    send -X stop-selection
  }
}

set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.tmux/plugins/'

# Plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-logging'
unbind l
set -g @logging_key "l"
set -g @logging-path "$HOME/.tmux/logs/"

run -b '~/.tmux/plugins/tpm/tpm'